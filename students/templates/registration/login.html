{% extends 'students/base.html' %}

{% block title %}Login | EduTrack{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">

        <div class="card content-card p-4">

            <h3 class="fw-bold mb-4 text-center">
                EduTrack Login
            </h3>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           required>
                </div>

                {% if form.errors %}
                    <p class="text-danger">
                        Invalid username or password.
                    </p>
                {% endif %}

                <button type="submit"
                        class="btn btn-primary w-100">
                    Login
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
