
{% extends 'students/base.html' %}

{% block title %}Add Course | EduTrack{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card content-card p-4">

            <h3 class="fw-bold mb-2">Add New Course</h3>

            <p class="text-muted mb-4">
                Enter the details below to create a new course.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Course Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="e.g. Python Programming"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Course Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter a brief course description..."
                    ></textarea>

                </div>


                <button type="submit" class="btn btn-primary px-4">
                    Save Course
                </button>

                <a href="{% url 'course_list' %}"
                   class="btn btn-light ms-2">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
